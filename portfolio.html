<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="Assets/style.css">
</head>

<template id="portfolio-section">
    <header>
        <div class="portfolio-piece-container">
            <div class="clickable-image-container">
                <a id="section-link" href="" target="_blank" rel="noopener noreferrer">
                    <img id="section-image" width="500px" src="">
                </a>
                <!-- <a href="" class="full-container-button" style="background-color: grey">Store Page</a> -->
            </div>
            <div class = "text-container">
                <h1 id="title">Template Title</h1>
                <p>
                    Sip Fisher is the cozy incremental game about sucking a lake up with a straw. It was a short student project with only <strong>three months development</strong>.
                    It has grossed over <strong>$130,000</strong> in revenue since it's release in August, 2025.
                    <br>
                    <br>
                    <i>I was brought on to this project initially as a <em>designer</em> and the sole <em>market researcher</em>. 
                    I was the primary <em>narrative designer</em>, focused on the game's ending and the character writing for our loveable shopkeep.
                    Post release, I became the <em>project lead</em> for content updates and bug fixes, working with a smaller team.</i>
            </div>
            <a href="" class="full-container-button">▼</a>
        </div>
    </header>
</template>

<body>
    <div id="container"></div>

    <script>
        const files = ["sip-fisher","horse-riding-classic"]
        const template = document.getElementById('portfolio-section');
        for (let i = 0; i < files.length; i++)
        {
            const clone = template.content.cloneNode(true);
            fetch('portfolio-assets/'+files[i]+'.md')
            .then(response => response.text())
            .then(data => {
                var lines = data.split(/\r?\n/);
                var title = lines[0].replace("TITLE:", "");
                var imagePath = lines[1].replace("IMAGE:","");
                var steamLink = lines[2].replace("STEAMLINK:","");

                clone.getElementById('title').textContent = title;
                const sectionImage = clone.getElementById('section-image');
                sectionImage.src = imagePath;
                const sectionLink = clone.getElementById('section-link');
                sectionLink.href = steamLink;

                container.appendChild(clone);
            })
            
        }
    </script>
    
</body>
</html>
